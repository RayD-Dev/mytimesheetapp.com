# Copy from docs/screens/sign-in.md. Keys not listed fall back to Keycloak's own wording.
# Keycloak messages are MessageFormat strings, so an apostrophe is written twice.
productName=Timesheets
loginTitle=Sign in
loginAccountTitle=Sign in
usernameOrEmail=Email
password=Password
showPassword=Show password
hidePassword=Hide password
doLogIn=Sign in
doForgotPassword=Forgot your password?
doLogout=Sign out
loggedOutMessage=You''ve signed out.

# Wrong email or password. One message for all three, so it never says which part was wrong.
invalidUserMessage=That email and password don''t match. Try again, or reset your password.
invalidPasswordMessage=That email and password don''t match. Try again, or reset your password.
invalidUsernameMessage=That email and password don''t match. Try again, or reset your password.
missingUsernameMessage=Enter your email address.
missingPasswordMessage=Enter your password.

# Browser-side checks in js/login.js (R8-4)
emailRequired=Enter your email address.
emailInvalid=Enter an email address, like name@example.com.
passwordRequired=Enter your password.

# Deactivated by the manager (FR-25). Keycloak's sanitiser keeps only a few tags, so the
# heading is <strong> (styled as the alert heading) and not an h2.
accountDisabledMessage=<strong>This account has been deactivated</strong>You can''t sign in any more. If you think that''s a mistake, ask your manager.
