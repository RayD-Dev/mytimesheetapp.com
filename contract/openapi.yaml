openapi: 3.1.0
info:
  title: Timesheet API, slice 1
  version: 1.0.0
  description: >-
    Slice 1 contract: sign-in session, My timesheet, signature and submit.
    Times of day are 24-hour `HH:mm` strings, durations are integer minutes,
    dates are `YYYY-MM-DD`. All dates and times are in the business time zone.
    The front end is built against a mock of this file and the back end is built
    to it, so a change here comes first.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
security:
  - cookieAuth: []

paths:
  /api/v1/me:
    get:
      operationId: getMe
      summary: The signed-in person and their session
      description: >-
        Also sets the CSRF cookie `XSRF-TOKEN`, so it must be called before the first write.
      responses:
        '200':
          description: The signed-in person.
          headers:
            Set-Cookie:
              description: Sets the CSRF cookie `XSRF-TOKEN` (name confirmed by ticket BE-09).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/session/login:
    get:
      operationId: startLogin
      summary: Start sign-in at Keycloak
      description: Needs no session.
      security: []
      parameters:
        - name: returnTo
          in: query
          required: false
          description: >-
            Where to go after sign-in. Must be a relative path starting with '/';
            the server validates it (open-redirect guard). Anything else goes to `/timesheet`.
          schema:
            type: string
            pattern: '^/'
      responses:
        '302':
          description: Redirect to Keycloak's sign-in page.
          headers:
            Location:
              $ref: '#/components/headers/Location'

  /api/v1/session/logout:
    post:
      operationId: logout
      summary: Sign out
      description: Clears the session here and at Keycloak.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfTokenInvalid'

  /api/v1/session/keepalive:
    post:
      operationId: keepAlive
      summary: Stay signed in
      description: Called from the idle warning. Resets the idle timeout.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: The new session expiry times.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionExpiry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfTokenInvalid'

  /api/v1/session/change-password:
    get:
      operationId: changePassword
      summary: Go to Keycloak's password page
      description: >-
        Redirects to Keycloak (`kc_action=UPDATE_PASSWORD`). On success Keycloak returns to
        `/profile?passwordChanged=1`; on cancel or error it returns to `/profile`.
      responses:
        '302':
          description: Redirect to Keycloak's password page.
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/me/signature:
    get:
      operationId: getSignature
      summary: The saved signature
      responses:
        '200':
          description: The saved signature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSignature'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SignatureNotFound'
    put:
      operationId: putSignature
      summary: Save or replace the signature
      description: Image, kind, text and style are replaced together.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Signature'
      responses:
        '204':
          description: Saved.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfTokenInvalid'

  /api/v1/me/timesheets/{fortnightStart}:
    parameters:
      - $ref: '#/components/parameters/FortnightStart'
    get:
      operationId: getTimesheet
      summary: A timesheet with its hours and warnings
      responses:
        '200':
          description: The timesheet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timesheet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/FortnightNotFound'
        '422':
          $ref: '#/components/responses/PayScheduleNotSet'
    delete:
      operationId: clearTimesheet
      summary: Clear all hours
      description: For a rejected timesheet, returns its deletion date.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: Cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfTokenInvalid'
        '404':
          $ref: '#/components/responses/FortnightNotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'

  /api/v1/me/timesheets/{fortnightStart}/days/{date}:
    put:
      operationId: saveDay
      summary: Autosave one day
      parameters:
        - $ref: '#/components/parameters/FortnightStart'
        - name: date
          in: path
          required: true
          description: The day being saved. Must fall inside the fortnight.
          schema:
            $ref: '#/components/schemas/Date'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDayRequest'
      responses:
        '200':
          description: Saved. The figures replace the on-screen preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveDayResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfTokenInvalid'
        '404':
          $ref: '#/components/responses/FortnightNotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'

  /api/v1/me/timesheets/{fortnightStart}/submit:
    post:
      operationId: submitTimesheet
      summary: Submit the timesheet
      description: Refused without a signature. Submits the version the page last received.
      parameters:
        - $ref: '#/components/parameters/FortnightStart'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
      responses:
        '204':
          description: Submitted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfTokenInvalid'
        '404':
          $ref: '#/components/responses/FortnightNotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          description: The timesheet cannot be submitted.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SignatureRequiredError'
                  - $ref: '#/components/schemas/NoHoursError'
                  - $ref: '#/components/schemas/WarningTicksMismatchError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SESSION
      description: >-
        HttpOnly session cookie set after sign-in at Keycloak. The cookie name is
        confirmed by ticket BE-09.

  parameters:
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: >-
        CSRF token, copied from the `XSRF-TOKEN` cookie that `GET /api/v1/me` sets.
        Required on every PUT, POST and DELETE. Ticket BE-09 confirms the header and cookie names.
      schema:
        type: string
    FortnightStart:
      name: fortnightStart
      in: path
      required: true
      description: First day (a Monday) of the fortnight.
      schema:
        $ref: '#/components/schemas/Date'

  headers:
    Location:
      description: Where to go next.
      schema:
        type: string

  responses:
    Unauthorized:
      description: Not signed in, or the session has ended.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
    CsrfTokenInvalid:
      description: The CSRF header is missing or wrong.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CsrfTokenInvalidError'
    VersionConflict:
      description: The timesheet changed on another device.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VersionConflictError'
    ValidationFailed:
      description: One or more fields are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    SignatureNotFound:
      description: No signature has been saved.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SignatureNotFoundError'
    FortnightNotFound:
      description: >-
        No timesheet for that fortnight. A rejected timesheet is always openable,
        whatever its fortnight (FR-17), so this never answers for one.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FortnightNotFoundError'
    PayScheduleNotSet:
      description: The pay schedule is not set, so there are no fortnights.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PayScheduleNotSetError'

  schemas:
    Date:
      type: string
      format: date
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: Calendar date, `YYYY-MM-DD`.
    ClockTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: 24-hour time of day, `HH:mm`.
    Version:
      type: integer
      minimum: 0
      description: The timesheet's version, sent back with each write.
    Minutes:
      type: integer
      minimum: 0

    SessionExpiry:
      type: object
      required: [idleExpiresAt, absoluteExpiresAt]
      properties:
        idleExpiresAt:
          type: string
          format: date-time
        absoluteExpiresAt:
          type: string
          format: date-time
    Me:
      allOf:
        - $ref: '#/components/schemas/SessionExpiry'
        - type: object
          required:
            - name
            - roles
            - today
            - payScheduleSet
            - signatureSet
            - currentFortnightStart
            - previousFortnightStart
            - periodLengthDays
          properties:
            name:
              type: string
            roles:
              type: array
              items:
                type: string
                enum: [employee, manager]
            today:
              $ref: '#/components/schemas/Date'
            payScheduleSet:
              type: boolean
            signatureSet:
              type: boolean
            currentFortnightStart:
              description: Null until the pay schedule is set.
              oneOf:
                - $ref: '#/components/schemas/Date'
                - type: 'null'
            previousFortnightStart:
              description: Null until the pay schedule is set.
              oneOf:
                - $ref: '#/components/schemas/Date'
                - type: 'null'
            periodLengthDays:
              type: integer
              minimum: 1

    Signature:
      type: object
      required: [image, kind, text, style]
      properties:
        image:
          type: string
          contentEncoding: base64
          contentMediaType: image/png
          description: The signature as a PNG. This is the record that submissions copy.
        kind:
          type: string
          enum: [drawn, typed]
        text:
          type: string
          description: The typed text. Only pre-fills the editor.
        style:
          type: integer
          enum: [1, 2, 3]
          description: The typed style. Only pre-fills the editor.
    SavedSignature:
      allOf:
        - $ref: '#/components/schemas/Signature'
        - type: object
          required: [savedAt]
          properties:
            savedAt:
              type: string
              format: date-time

    Day:
      type: object
      required: [date, start, breakMinutes, finish, workedMinutes, warnings]
      properties:
        date:
          $ref: '#/components/schemas/Date'
        start:
          oneOf:
            - $ref: '#/components/schemas/ClockTime'
            - type: 'null'
        breakMinutes:
          $ref: '#/components/schemas/Minutes'
        finish:
          oneOf:
            - $ref: '#/components/schemas/ClockTime'
            - type: 'null'
        workedMinutes:
          $ref: '#/components/schemas/Minutes'
        warnings:
          type: array
          items:
            type: string
            enum: [SHORT_SHIFT, LONG_SHIFT]
    Totals:
      type: object
      required: [weekMinutes, fortnightMinutes]
      properties:
        weekMinutes:
          description: Worked minutes for week 1 and week 2, in order.
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/Minutes'
        fortnightMinutes:
          $ref: '#/components/schemas/Minutes'
    Timesheet:
      type: object
      required:
        - fortnightStart
        - status
        - version
        - rejectionReason
        - deletionDate
        - days
        - totals
      properties:
        fortnightStart:
          $ref: '#/components/schemas/Date'
        status:
          type: string
          enum: [Draft, Submitted, Approved, Rejected]
        version:
          $ref: '#/components/schemas/Version'
        rejectionReason:
          type: [string, 'null']
        deletionDate:
          oneOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
        days:
          description: Monday to Friday of both weeks, in order.
          type: array
          minItems: 10
          maxItems: 10
          items:
            $ref: '#/components/schemas/Day'
        totals:
          $ref: '#/components/schemas/Totals'

    VersionRequest:
      type: object
      required: [version]
      properties:
        version:
          $ref: '#/components/schemas/Version'
    ClearResult:
      type: object
      required: [version, deletionDate]
      properties:
        version:
          $ref: '#/components/schemas/Version'
        deletionDate:
          oneOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
    SaveDayRequest:
      type: object
      required: [version, start, breakMinutes, finish]
      properties:
        version:
          $ref: '#/components/schemas/Version'
        start:
          oneOf:
            - $ref: '#/components/schemas/ClockTime'
            - type: 'null'
        breakMinutes:
          $ref: '#/components/schemas/Minutes'
        finish:
          oneOf:
            - $ref: '#/components/schemas/ClockTime'
            - type: 'null'
    SaveDayResult:
      type: object
      required: [version, day, totals, deletionDate]
      properties:
        version:
          $ref: '#/components/schemas/Version'
        day:
          $ref: '#/components/schemas/Day'
        totals:
          $ref: '#/components/schemas/Totals'
        deletionDate:
          oneOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
    SubmitRequest:
      type: object
      required: [version, declaration, warningDayTicks]
      properties:
        version:
          $ref: '#/components/schemas/Version'
        declaration:
          type: boolean
          const: true
        warningDayTicks:
          description: The warning days the employee ticked as correct.
          type: array
          items:
            $ref: '#/components/schemas/Date'

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable code the client maps to its designed message.
        message:
          type: string
          description: English text for logs and support.
    UnauthorizedError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            code:
              const: UNAUTHORIZED
    CsrfTokenInvalidError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            code:
              const: CSRF_TOKEN_INVALID
    VersionConflictError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            code:
              const: VERSION_CONFLICT
    SignatureRequiredError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            code:
              const: SIGNATURE_REQUIRED
    NoHoursError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            code:
              const: NO_HOURS
    WarningTicksMismatchError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            code:
              const: WARNING_TICKS_MISMATCH
    PayScheduleNotSetError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            code:
              const: PAY_SCHEDULE_NOT_SET
    SignatureNotFoundError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            code:
              const: SIGNATURE_NOT_FOUND
    FortnightNotFoundError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            code:
              const: FORTNIGHT_NOT_FOUND
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          required: [fieldErrors]
          properties:
            code:
              const: VALIDATION_FAILED
            fieldErrors:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          enum: [start, breakMinutes, finish]
        code:
          type: string
          enum:
            - FINISH_BEFORE_START
            - BREAK_TOO_LONG
            - FUTURE_DAY
            - START_MISSING
            - FINISH_MISSING
